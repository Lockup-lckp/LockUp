<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-lckp.png" />

    <!-- Fontes: preconnect abre a conexão (DNS + TLS) com o CDN em paralelo ao
         resto da página, e o stylesheet fica no HTML para o parser achar na
         primeira passada. Estava como @import dentro do index.css, o que
         serializava CSS -> parse -> fonte e atrasava o primeiro texto. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Mesma ideia para o backend. A primeira chamada da aplicação (buscar a
         escola da URL) só acontece depois que o JS carrega e executa; sem isto
         ela ainda paga DNS + TLS + handshake ali na hora. O Vite troca
         %VITE_API_URL% pelo valor do build. -->
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="LCKP — plataforma de locação de armários para escolas. Pagamento por Pix ou cartão, painel de gestão e identidade visual próprios de cada instituição." />
    <title>LCKP — Locação de Armários</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
